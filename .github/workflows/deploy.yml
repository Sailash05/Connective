name: EC2 Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /home/ubuntu/Connective
          git fetch --all
          git reset --hard origin/main

      - name: Install client dependencies
        run: |
          cd /home/ubuntu/Connective/client
          npm install --legacy-peer-deps
          npm run build

      - name: Install server dependencies
        run: |
          cd /home/ubuntu/Connective/server
          npm install --legacy-peer-deps

      - name: Restart backend PM2
        run: |
          cd /home/ubuntu/Connective/server
          pm2 restart connective || pm2 start src/server.js --name connective --watch
          pm2 save
